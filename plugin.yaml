name: model-kombat
version: 0.2.0
description: "Model Kombat — pit two Hermes models against each other in 3 escalating rounds (Warm-up, Main Event, Championship + sudden death), scored mechanically (executed code, exact counts, synonym-aware facts), with a live kanban scoreboard and optional agentic worker fights. Choose your fighter."
author: DarkeTech
kind: standalone
requires_hermes: ">=0.23.0"
capabilities:
  - llm.model_override
provides_tools:
  - kombat_list_tasks
  - kombat_run_fight
  - kombat_run_agentic_fight
  - kombat_score_answers
  - kombat_history
  - kombat_export
config_schema:
  fighter_a:
    type: str
    default: "stealth/crouton-alpha"
    label: "Fighter A (model ID)"
    description: "First model ID to fight, e.g. stealth/crouton-alpha"
  fighter_b:
    type: str
    default: "deepseek/deepseek-v4.1-flash-1017"
    label: "Fighter B (model ID)"
    description: "Second model ID to fight, e.g. deepseek/deepseek-v4.1-flash-1017"
  temperature:
    type: float
    default: 0
    label: "Sampling temperature"
    description: "Applied to both fighters in pure fights. 0 = deterministic-ish, fairest."
  max_tokens:
    type: int
    default: 2000
    label: "Max tokens per answer"
  max_fight_cost_usd:
    type: float
    default: 2.0
    label: "Pure-fight budget cap (USD)"
    description: "Pure fights stop once cumulative estimated cost exceeds this. Agentic worker billing is separate and not capped."
  llm_timeout_s:
    type: float
    default: 180
    label: "Per-call timeout (seconds)"
  agentic_timeout_s:
    type: int
    default: 600
    label: "Agentic per-task max runtime (seconds)"
  allow_code_execution:
    type: bool
    default: false
    label: "Allow executing model-written code"
    description: "Code tasks (T2/T6/T7/T8) are only executed when this is on. Runs as your user with a timeout — NOT a security sandbox. Off = those rounds are excluded from points, never run."
  show_on_kanban:
    type: bool
    default: true
    label: "Show fights on the kanban board"
    description: "Live scoreboard on the dedicated model-kombat board (display only, unassigned cards). Turn off to keep fights off the board."
