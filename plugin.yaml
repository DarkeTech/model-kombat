name: model-kombat
version: 0.7.0
description: "Model Kombat — pit two Hermes models against each other on an adaptive lane card (Warm-up, Main Event, Championship + sudden death) or the fixed suite, scored mechanically (executed code, exact counts, synonym-aware facts, SQL rows), with a local lane scout, live kanban scoreboard and optional agentic worker fights."
author: DarkeTech
kind: standalone
requires_hermes: ">=0.23.0"
capabilities:
  - llm.model_override
provides_tools:
  - kombat_list_tasks
  - kombat_run_fight
  - kombat_scout
  - kombat_run_agentic_fight
  - kombat_score_answers
  - kombat_rematch_errors
  - kombat_recommend
  - kombat_history
  - kombat_export
config_schema:
  fighter_a:
    type: str
    default: "z-ai/glm-5.3-flash"
    label: "Fighter A (model ID)"
    description: "First model ID to fight, e.g. z-ai/glm-5.3-flash"
  fighter_b:
    type: str
    default: "deepseek/deepseek-v4.1-flash-1017"
    label: "Fighter B (model ID)"
    description: "Second model ID to fight, e.g. deepseek/deepseek-v4.1-flash-1017"
  temperature:
    type: float
    default: 0
    label: "Sampling temperature"
    description: "Applied to both fighters in pure fights. 0 = deterministic-ish, fairest."
  default_intensity:
    type: str
    default: "standard"
    label: "Default card intensity"
    description: "Difficulty mix when a scout/fight does not pass intensity: standard (d1/d2/d3), hard (d2/d3, no d1) or gauntlet (every task d3)."
    choices:
      - standard
      - hard
      - gauntlet
  max_tokens:
    type: int
    default: 2000
    label: "Max tokens per answer"
  max_fight_cost_usd:
    type: float
    default: 2.0
    label: "Pure-fight budget cap (USD)"
    description: "Pure fights stop once cumulative estimated cost exceeds this. Agentic worker billing is separate and not capped. When a model has no known price its cost is 'n/a' and only the token cap applies."
  max_fight_tokens:
    type: int
    default: 400000
    label: "Pure-fight token budget cap"
    description: "Pure fights stop once combined input+output tokens across both fighters exceed this. Works even when prices are unknown."
  model_prices:
    type: dict
    default: {}
    label: "Model prices (USD per 1M tokens)"
    description: "JSON map of model ID -> {\"in\": USD per 1M input tokens, \"out\": USD per 1M output tokens}. Merged over the shipped prices.json; unknown models cost 'n/a' (never 0)."
  llm_timeout_s:
    type: float
    default: 180
    label: "Per-call timeout (seconds)"
    description: "Hard per-call deadline. Calls run in a worker thread and are abandoned at the deadline, so a hung streamed response never blocks the fight (it counts as an errored attempt and is retried once)."
  max_fight_seconds:
    type: int
    default: 360
    label: "Whole-fight wall-clock cap (seconds)"
    description: "After this many seconds the remaining (task, fighter) pairs are marked skipped with 'fight time cap' and the fight returns a partial result (time_cap_hit). Kept under the host's ~420s tool timeout; use background:true or a task subset for longer cards."
  stale_card_minutes:
    type: int
    default: 30
    label: "Stale scoreboard card age (minutes)"
    description: "At the start of every fight, open FIGHT/REMATCH/R1–R3 scoreboard cards older than this (and not part of a live bout) are commented 'Stale — closed by Model Kombat' and completed/archived."
  pace_ms:
    type: int
    default: 0
    label: "Polite pacing between calls (ms)"
    description: "Pause before each model call to avoid tripping provider rate limits. 0 = no pause."
  max_rate_wait_s:
    type: float
    default: 120
    label: "Longest 429 wait (seconds)"
    description: "When a provider says retry_after, wait at most this long per 429 instead of failing the task."
  auto_rematch:
    type: bool
    default: true
    label: "Auto-rematch errored tasks inside a fight"
    description: "Retry errored (task, fighter) pairs up to 2 extra passes within the same fight. Exhausted pairs stay errored (never failed)."
  agentic_timeout_s:
    type: int
    default: 600
    label: "Agentic per-task max runtime (seconds)"
  allow_code_execution:
    type: bool
    default: false
    label: "Allow executing model-written code"
    description: "Code tasks (T2/T6/T7/T8) are only executed when this is on. Runs as your user with a timeout — NOT a security sandbox. Off = those rounds are excluded from points, never run."
  show_on_kanban:
    type: bool
    default: true
    label: "Show fights on the kanban board"
    description: "Live scoreboard on the dedicated model-kombat board (display only, unassigned cards). Turn off to keep fights off the board."
