name: model-kombat
repo: https://github.com/DarkeTech/model-kombat
sha: "0000000000000000000000000000000000000000"
title: "Model Kombat"
description: >-
  Pit two Hermes models against each other in 3 escalating rounds (Warm-up 1pt,
  Main Event 2pt, Championship 3pt) plus sudden death, scored mechanically —
  executed code, exact counts, synonym-aware fact matching — with a live
  kanban scoreboard and optional agentic worker fights. Choose your fighter.
  Disclosure — pure fights call the user's configured provider through the host
  LLM facade (ctx.llm) with per-call latency/token/cost recorded and a spend
  budget cap (default $2.00); agentic fights dispatch real kanban workers with
  per-task model overrides, billed per worker session and not budget-capped.
  Optional code execution (off by default) runs model-written Python in a
  subprocess with a timeout as the user — not a security sandbox. With the
  kanban scoreboard on (default), the plugin creates/updates unassigned
  display cards on a dedicated model-kombat board via the host terminal tool.
  Reports, fight history and exports are written under the plugin data dir.
  No telemetry; the plugin never reads credentials or other credential stores.
maintainer: DarkeTech
tier: community
category: models
requires_hermes: ">=0.23.0"
docs_url: https://github.com/DarkeTech/model-kombat#readme
version: "0.3.0"
platforms: []
screenshots: []
capabilities:
  provides_tools:
    - kombat_list_tasks
    - kombat_run_fight
    - kombat_run_agentic_fight
    - kombat_score_answers
    - kombat_rematch_errors
    - kombat_history
    - kombat_export
  provides_hooks: []
  provides_middleware: []
  requires_env: []
